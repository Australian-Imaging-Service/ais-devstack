{{- $fullname := include "nfs-server.fullname" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-{{ $fullname }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
