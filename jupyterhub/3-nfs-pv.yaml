apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyter-xnat-gpfs-shared
spec:
  capacity:
    storage: 600Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-xnat
  local:
    path: /srv/xnat-local-storage/gpfs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xnat-host
