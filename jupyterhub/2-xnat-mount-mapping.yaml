# ConfigMap: XNAT archive path to shared local-storage subPath mapping
# ====================================================
# Maps the XNAT container-internal archive root to the archive subPath on the
# xnat-gpfs volume (/srv/xnat-local-storage/gpfs on xnat-host).
#
# XNAT's JupyterHub plugin returns mount sources as container-internal
# paths (e.g., /data/xnat/archive/my-project/arc001). The JupyterHub
# pre_spawn_hook translates that prefix to the volume's archive subPath and
# appends the project/session remainder.
#
# New projects under /srv/xnat-local-storage/gpfs/archive require no mapping
# change. If the XNAT API returns /data/xnat/archive/my-project/arc001, the
# resolved volume subPath is archive/my-project/arc001.
# ====================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: xnat-mount-mapping
  namespace: jupyter
data:
  mount-mapping.json: |
    {
      "/data/xnat/archive": "archive"
    }
