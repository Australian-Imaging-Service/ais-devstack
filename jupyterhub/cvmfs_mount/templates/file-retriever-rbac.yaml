apiVersion: v1
kind: ServiceAccount
metadata:
  name: cvmfs-file-retriever
  namespace: mounts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: mounts
  name: cvmfs-file-retriever
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cvmfs-file-retriever
  namespace: mounts
subjects:
- kind: ServiceAccount
  name: cvmfs-file-retriever
  namespace: mounts
roleRef:
  kind: Role
  name: cvmfs-file-retriever
  apiGroup: rbac.authorization.k8s.io
