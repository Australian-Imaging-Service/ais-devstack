# SeaweedFS volume vacuum
# Filer-level deletes (e.g. the 4am ingest-uploaded-retention CronJob) only mark
# needles as deleted; disk space on /data/seaweedfs is reclaimed only when the
# volumes are compacted. On SeaweedFS 3.99 the threshold sweep
# `volume.vacuum -garbageThreshold 0.1` skips near-100%-garbage volumes, so this
# job selects volumes from `volume.list` by observed garbage (deleted bytes >=
# VACUUM_MIN_DELETED_MB, or garbage ratio >= VACUUM_MIN_RATIO) and vacuums each
# explicitly by volume id, one at a time, verifying every compact revision
# before moving on. It also disables the master's periodic automatic vacuum so
# this CronJob is the only scheduler for the lifetime of the master process.
# Runs at 5am, after retention, because needle
# deletions propagate to volume servers asynchronously; garbage not yet visible
# in volume.list is picked up on the next run.
#
# `weed shell` bootstraps over master gRPC at port+10000; the seaweedfs Service
# (applied ad-hoc, not in this repo) must expose 19333 (master-grpc) and 18888
# (filer-grpc) or the shell hangs on "WaitUntilConnected". Added 2026-07-11 via:
#   sudo kubectl -n seaweedfs patch svc seaweedfs --type=json -p='[
#     {"op":"add","path":"/spec/ports/-","value":{"name":"master-grpc","port":19333,"targetPort":19333,"protocol":"TCP"}},
#     {"op":"add","path":"/spec/ports/-","value":{"name":"filer-grpc","port":18888,"targetPort":18888,"protocol":"TCP"}}]'
#
# The seaweedfs Deployment (also not in this repo) must keep
# `-master.garbageThreshold=1.1` in its args. This prevents the master's first
# automatic sweep after a pod restart from compacting anything before this
# CronJob can issue `volume.vacuum.disable`.
#
# Manual trigger:
#   sudo kubectl -n seaweedfs create job --from=cronjob/seaweedfs-vacuum seaweedfs-vacuum-manual-$(date +%s)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-vacuum
  namespace: seaweedfs
data:
  vacuum.sh: |
    #!/bin/sh
    set -eu
    MASTER="${MASTER:-seaweedfs.seaweedfs.svc.cluster.local:9333}"
    MIN_MB="${VACUUM_MIN_DELETED_MB:-64}"
    MIN_RATIO="${VACUUM_MIN_RATIO:-0.25}"
    VERIFY_ATTEMPTS="${VACUUM_VERIFY_ATTEMPTS:-12}"
    VERIFY_DELAY="${VACUUM_VERIFY_DELAY_SECONDS:-5}"
    COMMAND_ATTEMPTS="${VACUUM_COMMAND_ATTEMPTS:-3}"
    SHELL_TIMEOUT="${VACUUM_SHELL_TIMEOUT_SECONDS:-900}"

    weed_shell() {
      timeout "$SHELL_TIMEOUT" weed shell -master="$MASTER"
    }

    volume_state() {
      snapshot="$1"
      wanted="$2"
      echo "$snapshot" | awk -v wanted="$wanted" '
        /volume id:/ {
          id = ""; revision = 0; deleted = 0
          for (i = 1; i <= NF; i++) {
            if ($i ~ /^id:/)                 { split($i, a, ":"); id = a[2] }
            if ($i ~ /^compact_revision:/)   { split($i, a, ":"); revision = a[2] }
            if ($i ~ /^deleted_byte_count:/) { split($i, a, ":"); deleted = a[2] }
          }
          if (id == wanted) {
            print revision, deleted
            exit
          }
        }'
    }

    # The master otherwise starts an independent automatic sweep every
    # approximately 14-16 minutes. This setting is in-memory and is therefore
    # re-applied on every CronJob run after a master restart.
    { echo lock
      echo volume.vacuum.disable
      echo unlock
    } | weed_shell
    echo "disabled master automatic vacuum; controlled per-volume vacuum is authoritative"

    list=$(echo volume.list | weed_shell)
    echo "$list" | grep -q 'volume id:' || { echo "volume.list returned no volumes" >&2; exit 1; }

    ids=$(echo "$list" | awk -v min_mb="$MIN_MB" -v min_ratio="$MIN_RATIO" '
      /volume id:/ {
        id = ""; size = 0; del = 0
        for (i = 1; i <= NF; i++) {
          if ($i ~ /^id:/)                 { split($i, a, ":"); id = a[2] }
          if ($i ~ /^size:/)               { split($i, a, ":"); size = a[2] }
          if ($i ~ /^deleted_byte_count:/) { split($i, a, ":"); del = a[2] }
        }
        if (id == "" || del == 0) next
        if (del >= min_mb * 1048576 || (size > 0 && del / size >= min_ratio)) {
          n += 1; total += del
          # Include deleted bytes so the selected set can be ordered largest
          # first below. Under disk pressure this reclaims the most space
          # before spending time compacting small-garbage volumes.
          print del, id
        }
      }
      END { printf "selected %d volumes, %.1f MiB garbage\n", n, total / 1048576 > "/dev/stderr" }')

    ids=$(echo "$ids" | sort -rn | awk '{ print $2 }')

    if [ -z "$ids" ]; then
      echo "no volumes above vacuum threshold (>=${MIN_MB}MiB deleted or ratio>=${MIN_RATIO})"
      exit 0
    fi
    echo "vacuuming volumes:" $ids

    # A stuck master vacuum lock makes every volume.vacuum a silent no-op
    # ("Vacuum is already running" in the master log) while weed shell still
    # exits 0. Run one volume per request and require that volume's compact
    # revision to advance before moving to the next one. A short-lived collision
    # with an automatic sweep left over from before the disable command is
    # retried; a permanently stuck guard fails on the exact affected volume.
    compacted_count=0
    for id in $ids; do
      before_state=$(volume_state "$list" "$id")
      if [ -z "$before_state" ]; then
        echo "selected volume $id disappeared from volume.list before vacuum" >&2
        exit 1
      fi
      before_revision=${before_state%% *}
      before_deleted=${before_state#* }
      command_attempt=1
      compacted=0

      while [ "$command_attempt" -le "$COMMAND_ATTEMPTS" ]; do
        echo "vacuuming volume $id (revision=$before_revision deleted_bytes=$before_deleted, command attempt ${command_attempt}/${COMMAND_ATTEMPTS})"
        if ! { echo lock
               # Selection is done above, so override the default threshold
               # (0.3), which can silently skip an explicitly selected volume.
               echo "volume.vacuum -garbageThreshold 0.001 -volumeId $id"
               echo unlock
             } | weed_shell; then
          echo "volume $id vacuum command failed or exceeded ${SHELL_TIMEOUT}s" >&2
          if [ "$command_attempt" -lt "$COMMAND_ATTEMPTS" ]; then
            sleep "$VERIFY_DELAY"
          fi
          command_attempt=$((command_attempt + 1))
          continue
        fi

        verify_attempt=1
        while [ "$verify_attempt" -le "$VERIFY_ATTEMPTS" ]; do
          if ! after=$(echo volume.list | weed_shell); then
            echo "volume.list verification for volume $id failed or exceeded ${SHELL_TIMEOUT}s" >&2
            if [ "$verify_attempt" -lt "$VERIFY_ATTEMPTS" ]; then
              sleep "$VERIFY_DELAY"
            fi
            verify_attempt=$((verify_attempt + 1))
            continue
          fi
          after_state=$(volume_state "$after" "$id")
          if [ -z "$after_state" ]; then
            echo "volume $id disappeared from volume.list while verifying vacuum" >&2
            exit 1
          fi
          after_revision=${after_state%% *}
          after_deleted=${after_state#* }
          if [ "$after_revision" -gt "$before_revision" ]; then
            echo "verified volume $id compacted: revision $before_revision->$after_revision, deleted_bytes $before_deleted->$after_deleted"
            compacted=1
            compacted_count=$((compacted_count + 1))
            break
          fi
          if [ "$verify_attempt" -lt "$VERIFY_ATTEMPTS" ]; then
            echo "volume $id revision still $after_revision; retrying verification in ${VERIFY_DELAY}s (${verify_attempt}/${VERIFY_ATTEMPTS})"
            sleep "$VERIFY_DELAY"
          fi
          verify_attempt=$((verify_attempt + 1))
        done

        if [ "$compacted" -eq 1 ]; then
          break
        fi
        if [ "$command_attempt" -lt "$COMMAND_ATTEMPTS" ]; then
          echo "volume $id did not compact; retrying the vacuum command"
        fi
        command_attempt=$((command_attempt + 1))
      done

      if [ "$compacted" -ne 1 ]; then
        echo "volume $id was not compacted after ${COMMAND_ATTEMPTS} command attempt(s);" \
             "master vacuum guard may be stuck - check for 'Vacuum is already running'" >&2
        exit 1
      fi
    done

    echo "post-vacuum remaining garbage:"
    echo "$after" | \
      awk '/volume id:/ { for (i = 1; i <= NF; i++) if ($i ~ /^deleted_byte_count:/) { split($i, a, ":"); t += a[2] } }
           END { printf "%.1f MiB across all volumes\n", t / 1048576 }'
    echo "verified all $compacted_count selected volume(s)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-vacuum
  namespace: seaweedfs
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The script retries only the affected volume. Re-running the complete
      # batch can duplicate successful compactions and obscure the first error.
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: vacuum
              image: chrislusf/seaweedfs:3.99
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - /opt/vacuum/vacuum.sh
              volumeMounts:
                - name: script
                  mountPath: /opt/vacuum
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: seaweedfs-vacuum
