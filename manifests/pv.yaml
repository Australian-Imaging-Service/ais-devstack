# XNAT Persistent Volumes
# Static local PVs for the single-node deployment. These remove the in-cluster
# NFS server from XNAT's write path and pin the data to xnat-host.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-xnat
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xnat-nfs
spec:
  capacity:
    storage: 600Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-xnat
  local:
    path: /srv/xnat-local-storage/xnat
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xnat-host
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xnat-build
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-xnat
  local:
    path: /srv/xnat-local-storage/xnat/data/build
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xnat-host
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xnat-gpfs
spec:
  capacity:
    storage: 600Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-xnat
  local:
    path: /srv/xnat-local-storage/gpfs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - xnat-host
