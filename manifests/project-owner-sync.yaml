# XNAT project owner sync
# Keeps configured users in the Owners group for every current and future project.
#
# Manual trigger:
#   sudo kubectl -n ais-xnat create job --from=cronjob/project-owner-sync project-owner-sync-manual-$(date +%s)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: project-owner-sync
  namespace: ais-xnat
data:
  sync-project-owners.py: |
    import atexit
    import base64
    import json
    import os
    import re
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    xnat_url = os.environ.get("XNAT_URL", "http://xnat-web.ais-xnat.svc.cluster.local").rstrip("/")
    username = os.environ["XNAT_USER"]
    password = os.environ["XNAT_PASS"]
    owner_users = [
        item.strip()
        for item in os.environ.get("XNAT_OWNER_USERS", "brosnan").split(",")
        if item.strip()
    ]

    if not owner_users:
        raise SystemExit("XNAT_OWNER_USERS must include at least one username")

    auth = base64.b64encode(f"{username}:{password}".encode()).decode()

    def quote(value):
        return urllib.parse.quote(value, safe="")

    session_id = None

    def request(method, path, expect_json=False):
        # Reuse one JSESSION for the whole run. Per-request Basic auth mints a
        # new 8-hour server-side session each call; at ~70 calls/run every
        # 15 min that trips concurrentMaxSessions (1000) and locks the admin
        # account out with 401s until sessions expire or are invalidated.
        if session_id:
            headers = {"Cookie": f"JSESSIONID={session_id}"}
        else:
            headers = {"Authorization": f"Basic {auth}"}
        req = urllib.request.Request(
            f"{xnat_url}{path}",
            method=method,
            headers=headers,
        )
        try:
            with urllib.request.urlopen(req, timeout=60) as response:
                body = response.read()
        except urllib.error.HTTPError as exc:
            body = exc.read().decode(errors="replace")
            sys.stderr.write(f"{method} {path} failed with HTTP {exc.code}: {body}\n")
            raise

        if expect_json:
            return json.loads(body.decode() or "null")
        return body

    def logout():
        try:
            request("DELETE", "/data/JSESSION")
        except Exception:  # noqa: BLE001
            pass

    session_id = request("POST", "/data/JSESSION").decode().strip()
    atexit.register(logout)

    def assert_owner_user_exists(owner_user):
        user = request("GET", f"/xapi/users/{quote(owner_user)}", expect_json=True)
        if user.get("enabled") is False:
            raise SystemExit(f"User {owner_user} exists but is disabled")
        if user.get("verified") is False:
            raise SystemExit(f"User {owner_user} exists but is not verified")

    def project_ids():
        result = request("GET", "/data/projects?format=json", expect_json=True)
        return sorted(row["ID"] for row in result["ResultSet"]["Result"])

    def project_has_owner(project, owner_user):
        result = request("GET", f"/data/projects/{quote(project)}/users?format=json", expect_json=True)
        for row in result["ResultSet"]["Result"]:
            login = (row.get("login") or row.get("username") or "").lower()
            display_name = (row.get("displayname") or "").lower()
            group_id = (row.get("GROUP_ID") or row.get("group_id") or "").lower()
            if login == owner_user.lower() and (
                display_name == "owners" or group_id == f"{project.lower()}_owner"
            ):
                return True
        return False

    for owner_user in owner_users:
        assert_owner_user_exists(owner_user)

    projects = project_ids()
    if not projects:
        print("No XNAT projects found")
        raise SystemExit(0)

    missing = []
    for project in projects:
        for owner_user in owner_users:
            request("PUT", f"/data/projects/{quote(project)}/users/Owners/{quote(owner_user)}")
            if project_has_owner(project, owner_user):
                print(f"Ensured {owner_user} is Owner of project {project}")
            else:
                missing.append((project, owner_user))

    # ── Group-derived owners ────────────────────────────────────────────
    # ais-edge routes DICOMs with PatientID <subject>@<group>/<project>.
    # The group name survives in each session's dcmPatientId. When it matches
    # an enabled XNAT user (e.g. polimeni), that user becomes an Owner of
    # every project that holds sessions belonging to the group.
    GROUP_PID_RE = re.compile(r"^[^@/]+@([A-Za-z][A-Za-z0-9_-]{1,63})/[A-Za-z0-9_-]+$")

    def group_owner_pairs():
        result = request(
            "GET",
            "/data/experiments?format=json&xsiType=xnat:imageSessionData"
            "&columns=project,dcmPatientId",
            expect_json=True,
        )
        pairs = set()
        for row in result["ResultSet"]["Result"]:
            match = GROUP_PID_RE.match(row.get("dcmPatientId") or "")
            if match and row.get("project"):
                pairs.add((row["project"], match.group(1)))
        return sorted(pairs)

    # /xapi/users/<name> returns HTTP 500 for unknown users, so check
    # membership against the full user list instead.
    all_users = set(request("GET", "/xapi/users", expect_json=True) or [])

    def enabled_user(name):
        if name not in all_users:
            return False
        return request("GET", f"/xapi/users/{quote(name)}/enabled", expect_json=True) is True

    usable_group_users = {}
    for project, group in group_owner_pairs():
        if group not in usable_group_users:
            usable_group_users[group] = enabled_user(group)
        if not usable_group_users[group]:
            print(f"Group {group} has no enabled XNAT user; skipping ownership of {project}")
            continue
        request("PUT", f"/data/projects/{quote(project)}/users/Owners/{quote(group)}")
        if project_has_owner(project, group):
            print(f"Ensured group user {group} is Owner of project {project}")
        else:
            missing.append((project, group))

    if missing:
        for project, owner_user in missing:
            sys.stderr.write(f"Missing verified owner row: project={project} owner={owner_user}\n")
        raise SystemExit(1)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-owner-sync
  namespace: ais-xnat
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /opt/project-owner-sync/sync-project-owners.py
              env:
                - name: XNAT_URL
                  value: "http://xnat-web.ais-xnat.svc.cluster.local"
                - name: XNAT_OWNER_USERS
                  value: "brosnan,edge-uploader"
                - name: XNAT_USER
                  valueFrom:
                    secretKeyRef:
                      name: xnat-archiver-creds
                      key: username
                - name: XNAT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: xnat-archiver-creds
                      key: password
              volumeMounts:
                - name: script
                  mountPath: /opt/project-owner-sync
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: project-owner-sync
