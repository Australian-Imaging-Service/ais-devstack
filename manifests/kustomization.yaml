# Kustomization for XNAT StatefulSet patches
# Adds custom local-PV volume mounts for archive, prearchive, build, plugins,
# and the host Docker socket used by XNAT Container Service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - all.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: xnat-web
      spec:
        template:
          spec:
            containers:
              - name: xnat-web
                volumeMounts:
                  - $patch: delete
                    mountPath: /data/xnat/archive
                  - mountPath: /data/xnat/prearchive
                    name: xnat-nfs
                    subPath: data/prearchive
                  - mountPath: /data/xnat/archive/DM_R01
                    name: xnat-gpfs
                    subPath: archive/DM_R01
                  - mountPath: /data/xnat/archive/NF1
                    name: xnat-gpfs
                    subPath: archive/NF1
                  - mountPath: /data/xnat/archive/berg1
                    name: xnat-gpfs
                    subPath: archive/berg1
                  - mountPath: /data/xnat/archive/chan1
                    name: xnat-gpfs
                    subPath: archive/chan1
                  - mountPath: /data/xnat/archive/ennis
                    name: xnat-gpfs
                    subPath: archive/ennis
                  - mountPath: /data/xnat/archive/goo
                    name: xnat-gpfs
                    subPath: archive/goo
                  - mountPath: /data/xnat/archive/misc
                    name: xnat-gpfs
                    subPath: archive/misc
                  - mountPath: /data/xnat/archive/nf
                    name: xnat-gpfs
                    subPath: archive/nf
                  - mountPath: /data/xnat/archive/openrecon
                    name: xnat-gpfs
                    subPath: archive/openrecon
                  - mountPath: /data/xnat/archive/proj_1
                    name: xnat-gpfs
                    subPath: uq01/pool01/proj_1/xnat
                  - mountPath: /data/xnat/archive/proj_2
                    name: xnat-gpfs
                    subPath: uq02/pool02/proj_2/xnat
                  - mountPath: /data/xnat/archive/test
                    name: xnat-gpfs
                    subPath: test/xnat
                  - mountPath: /data/xnat/build
                    name: xnat-build
                  - mountPath: /data/xnat/object-store
                    name: object-store
                    readOnly: true
                    mountPropagation: HostToContainer
                  - mountPath: /usr/local/share/xnat/plugins
                    name: xnat-nfs
                    readOnly: true
                    subPath: plugins
                  - mountPath: /data/xnat/archive/CONTAINER_EXEC
                    name: xnat-nfs
                    subPath: data/CONTAINER_EXEC
                  - mountPath: /usr/local/bin/init.sh
                    name: init
                    readOnly: true
                    subPath: init.sh
                  - mountPath: /var/run/docker.sock
                    name: docker-sock
            initContainers:
              - name: home-init
                command:
                  - /usr/local/bin/init.sh
                volumeMounts:
                  - mountPath: /usr/local/share/xnat/plugins
                    name: xnat-nfs
                    readOnly: true
                    subPath: plugins
                  - mountPath: /usr/local/bin/init.sh
                    name: init
                    readOnly: true
                    subPath: init.sh
            volumes:
              - $patch: delete
                name: archive
              - $patch: delete
                name: prearchive
              - name: xnat-nfs
                persistentVolumeClaim:
                  claimName: pv-xnat-nfs
              - name: xnat-gpfs
                persistentVolumeClaim:
                  claimName: pv-xnat-gpfs
              - name: xnat-build
                persistentVolumeClaim:
                  claimName: pv-xnat-build
              - name: object-store
                hostPath:
                  path: /srv/xnat-local-storage/gpfs/object-store
                  type: DirectoryOrCreate
              - name: init
                configMap:
                  name: xnat-web-init
                  defaultMode: 0555
                  items:
                    - key: init.sh
                      path: init.sh
              - name: docker-sock
                hostPath:
                  path: /var/run/docker.sock
                  type: Socket
