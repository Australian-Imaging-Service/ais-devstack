# Kustomization for XNAT StatefulSet patches
# Adds custom local-PV volume mounts for archive, prearchive, build, plugins,
# and the host Docker socket used by XNAT Container Service. The complete
# archive tree is mounted at once so dynamically-created projects use durable
# node-local storage without requiring a StatefulSet change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - all.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: xnat-web
      spec:
        template:
          spec:
            containers:
              - name: xnat-web
                volumeMounts:
                  - mountPath: /data/xnat/archive
                    name: xnat-gpfs
                    subPath: archive
                  - mountPath: /data/xnat/prearchive
                    name: xnat-nfs
                    subPath: data/prearchive
                  - mountPath: /data/xnat/build
                    name: xnat-build
                  - mountPath: /data/xnat/object-store
                    name: object-store
                    readOnly: true
                    mountPropagation: HostToContainer
                  - mountPath: /usr/local/share/xnat/plugins
                    name: xnat-nfs
                    readOnly: true
                    subPath: plugins
                  - mountPath: /usr/local/bin/init.sh
                    name: init
                    readOnly: true
                    subPath: init.sh
                  - mountPath: /var/run/docker.sock
                    name: docker-sock
            initContainers:
              - name: home-init
                command:
                  - /usr/local/bin/init.sh
                volumeMounts:
                  - mountPath: /usr/local/share/xnat/plugins
                    name: xnat-nfs
                    readOnly: true
                    subPath: plugins
                  - mountPath: /usr/local/bin/init.sh
                    name: init
                    readOnly: true
                    subPath: init.sh
            volumes:
              - $patch: delete
                name: archive
              - $patch: delete
                name: prearchive
              - name: xnat-nfs
                persistentVolumeClaim:
                  claimName: pv-xnat-nfs
              - name: xnat-gpfs
                persistentVolumeClaim:
                  claimName: pv-xnat-gpfs
              - name: xnat-build
                persistentVolumeClaim:
                  claimName: pv-xnat-build
              - name: object-store
                hostPath:
                  path: /srv/xnat-local-storage/gpfs/object-store
                  type: DirectoryOrCreate
              - name: init
                configMap:
                  name: xnat-web-init
                  defaultMode: 0555
                  items:
                    - key: init.sh
                      path: init.sh
              - name: docker-sock
                hostPath:
                  path: /var/run/docker.sock
                  type: Socket
